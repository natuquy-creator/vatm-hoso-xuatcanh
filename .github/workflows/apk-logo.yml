name: Dung APK Android VATM (logo)
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm tra file cần thiết
        run: |
          test -f index.html && echo "OK index.html" || { echo "THIEU index.html o thu muc goc kho"; exit 1; }
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Tạo dự án Capacitor trong thư mục build
        run: |
          mkdir -p build/www/icons
          cp index.html build/www/
          [ -f manifest.json ] && cp manifest.json build/www/ || true
          [ -f sw.js ] && cp sw.js build/www/ || true
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png icon-192.svg; do
            [ -f "$f" ] && cp "$f" build/www/icons/ || true
          done
          cd build
          cat > package.json <<'EOF'
          {
            "name": "vatm-hoso-app",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "vn.vatm.hosoxuatcanh",
            "appName": "VATM Hồ sơ",
            "webDir": "www",
            "backgroundColor": "#b91c1c",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

