name: Build VATM Android APK
on:
  workflow_dispatch:

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3

      - name: Ghép thư mục www từ các file ở gốc
        run: |
          mkdir -p www/icons
          cp index.html manifest.json sw.js www/
          cp icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png icon-192.svg www/icons/

      - run: npm install
      - run: npx cap add android

      - name: Tạo biểu tượng ứng dụng
        run: |
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert icon-source-1024.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/$f.png
            done
          done

      - run: npx cap sync android
      - run: cd android && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: VATM-HoSo-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
