name: Dung APK Android VATM
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cài Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Kiểm tra file và Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" 2>/dev/null || echo "Khong thay platforms"
          for f in index.html manifest.json sw.js icon-source-1024.png; do
            if [ -f "$f" ]; then echo "OK   $f"; else echo "THIEU $f"; fi
          done
          test -f index.html

      - name: Tạo dự án Capacitor trong thư mục build
        run: |
          mkdir -p build/www/icons
          cp index.html build/www/
          [ -f manifest.json ] && cp manifest.json build/www/ || true
          [ -f sw.js ] && cp sw.js build/www/ || true
          for f in icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png icon-192.svg; do
            [ -f "$f" ] && cp "$f" build/www/icons/ || true
          done
          cd build
          cat > package.json <<'EOF'
          {
            "name": "vatm-hoso-app",
            "version": "1.0.0",
            "private": true
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "vn.vatm.hosoxuatcanh",
            "appName": "VATM Hồ sơ",
            "webDir": "www",
            "backgroundColor": "#b91c1c",
            "server": { "androidScheme": "https" }
          }
          EOF
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

      - name: Tạo biểu tượng ứng dụng
        continue-on-error: true
        run: |
          SRC="$GITHUB_WORKSPACE/icon-source-1024.png"
          test -f "$SRC" || { echo "Khong co icon-source-1024.png, dung icon mac dinh"; exit 0; }
          RES="$GITHUB_WORKSPACE/build/android/app/src/main/res"
          BG=$(convert "$SRC" -format '%[hex:p{4,4}]' info: | cut -c1-6)
          [ -z "$BG" ] && BG=FFFFFF
          mkdir -p "$RES/values"
          printf '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">#%s</color>\n</resources>\n' "$BG" > "$RES/values/ic_launcher_background.xml"
          for d in mdpi:48:108 hdpi:72:162 xhdpi:96:216 xxhdpi:144:324 xxxhdpi:192:432; do
            IFS=: read n l f <<< "$d"
            inner=$(( f * 62 / 100 ))
            convert "$SRC" -resize ${l}x${l} "$RES/mipmap-$n/ic_launcher.png"
            convert "$SRC" -resize ${l}x${l} "$RES/mipmap-$n/ic_launcher_round.png"
            convert "$SRC" -resize ${inner}x${inner} -background none -gravity center -extent ${f}x${f} "$RES/mipmap-$n/ic_launcher_foreground.png"
          done

      - name: Đồng bộ Capacitor
        working-directory: build
        run: npx cap sync android

      - name: Dựng file APK
        working-directory: build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Tải APK lên
        uses: actions/upload-artifact@v4
        with:
          name: VATM-HoSo-android-apk
          path: build/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
