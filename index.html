<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#b91c1c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="VATM Hồ sơ">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
<link rel="apple-touch-icon" href="icons/icon-192.svg">
<title>VATM — Hồ sơ xuất cảnh</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#7f1d1d;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh}
.box{text-align:center;padding:2rem}
.spin{width:40px;height:40px;border:3px solid rgba(255,255,255,.3);border-top-color:#f0c14b;border-radius:50%;animation:s .8s linear infinite;margin:0 auto 1rem}
@keyframes s{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box"><div class="spin"></div><div>Đang tải ứng dụng VATM...</div></div>
<script>
(async function(){
  try {
    const n = 5;
    let b64 = '';
    for (let i = 0; i < n; i++) {
      const r = await fetch('./chunks/part' + i + '.txt');
      if (!r.ok) throw new Error('Thiếu part ' + i);
      b64 += await r.text();
    }
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const html = new TextDecoder('utf-8').decode(bytes);
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<div class="box"><p>Lỗi tải ứng dụng.</p><p style="opacity:.8;font-size:14px">'+e.message+'</p></div>';
  }
})();
</script>
</body>
</html>
